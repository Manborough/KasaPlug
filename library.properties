name=KasaPlug
version=1.0.0
author=Timothy Stanbrough
maintainer=Timothy Stanbrough <timothystanbrough@gmail.com>
sentence=Local-network client for legacy TP-Link Kasa smart plugs.
paragraph=Provides relay control, MAC discovery, bounded retries, and a verified fail-off countdown. Speaks the local protocol on TCP 9999 directly, with no cloud account, credentials or broker. Supports HS100, HS103, HS110 and KP105; Tapo-generation KLAP/AES hardware is not supported.
category=Device Control
url=https://github.com/Manborough/KasaPlug
architectures=esp32
depends=ArduinoJson (>=7.0.0)
includes=KasaPlug.h
